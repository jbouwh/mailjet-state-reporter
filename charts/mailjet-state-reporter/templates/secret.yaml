{{- if and .Values.credentials.create (not .Values.credentials.existingSecret) }}
{{- if or (not .Values.credentials.appId) (not .Values.credentials.appSecret) }}
{{- fail "credentials.create=true requires credentials.appId and credentials.appSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mailjet-state-reporter.secretName" . }}
  labels:
    {{- include "mailjet-state-reporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.credentials.appIdKey }}: {{ .Values.credentials.appId | quote }}
  {{ .Values.credentials.appSecretKey }}: {{ .Values.credentials.appSecret | quote }}
{{- end }}
