{{- if and (not .Values.settings.existingConfigMap) .Values.settings.content }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailjet-state-reporter.configMapName" . }}
  labels:
    {{- include "mailjet-state-reporter.labels" . | nindent 4 }}
data:
  {{ .Values.settings.key }}: |
    {{- .Values.settings.content | nindent 4 }}
{{- end }}
