# Helm values for the mailjet-state-reporter chart, used by the ArgoCD Application.
image:
  # Pin the image to the same release as the chart (targetRevision in the Application)
  tag: "v0.3.11"
  digest: "sha256:0fe161dd79bf6d6e03719ac6516ed0c3e2df4b67b300d77cf08203a7e313c51a"

settings:
  # Created by k8s/kustomization.yaml from k8s/settings.yaml
  existingConfigMap: mailjet-reporter-settings

credentials:
  # Created by k8s/vault-static-secret.yaml (Vault Secrets Operator)
  existingSecret: mailjet-credentials

persistence:
  size: 100Mi
  storageClass: ""
  annotations:
    # ArgoCD ignores helm.sh/resource-policy, so protect the state explicitly
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
