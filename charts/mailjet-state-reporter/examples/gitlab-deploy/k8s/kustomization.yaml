apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mailjet-reporter

resources:
  - namespace.yaml

configMapGenerator:
  - name: mailjet-reporter-settings
    files:
      - settings.yaml

generatorOptions:
  # The chart refers to the ConfigMap by name (settings.existingConfigMap).
  # Every job starts a new pod, so the next run always reads the current settings.
  disableNameSuffixHash: true

# Credentials: the Secret mailjet-credentials (credentials.existingSecret in values.yaml).
# With Vault: keep the component below. Without Vault: remove it and create the
# Secret in another way, see the chart README ("Credentials without Vault").
components:
  - vault
