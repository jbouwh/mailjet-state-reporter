# CI for the GitLab deploy repository. ArgoCD only syncs the default branch,
# so make these jobs required ("Pipelines must succeed" + protected branch).
variables:
  # Harbor proxy cache projects (registry prefixes) for Docker Hub, ghcr.io and registry.k8s.io
  DOCKERHUB_PROXY: "harbor.example.com/dockerhub"
  GHCR_PROXY: "harbor.example.com/ghcr"
  K8S_REGISTRY_PROXY: "harbor.example.com/k8s"
  # Helm chart (OCI) and its version; must match targetRevision in argocd/application.yaml
  # and image.tag in values.yaml (chart 0.3.11 = image v0.3.11)
  CHART: "oci://${GHCR_PROXY}/jbouwh/charts/mailjet-state-reporter"
  CHART_VERSION: "0.3.11"
  RELEASE_NAME: "mailjet-state-reporter"
  NAMESPACE: "mailjet-reporter"
  YAMLLINT_VERSION: "1.38.0"

stages:
  - validate

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

yamllint:
  stage: validate
  # Official Docker Hub images are in the library/ namespace of the proxy cache
  image: ${DOCKERHUB_PROXY}/library/python:3.14-alpine
  script:
    - pip install --quiet "yamllint==${YAMLLINT_VERSION}"
    - yamllint -c .yamllint.yaml -f colored .

render-chart:
  stage: validate
  image:
    name: ${DOCKERHUB_PROXY}/alpine/helm:4.3.2
    entrypoint: [""]
  script:
    # Optional: log in when the Harbor project is not public (set masked CI/CD variables)
    - >-
      if [ -n "${HARBOR_USERNAME:-}" ]; then
      echo "${HARBOR_PASSWORD}" | helm registry login "${GHCR_PROXY%%/*}"
      --username "${HARBOR_USERNAME}" --password-stdin; fi
    - helm pull "${CHART}" --version "${CHART_VERSION}" --untar --untardir /tmp/chart
    - helm lint --strict /tmp/chart/mailjet-state-reporter -f values.yaml
    - >-
      helm template "${RELEASE_NAME}" /tmp/chart/mailjet-state-reporter
      --namespace "${NAMESPACE}" -f values.yaml > chart.yaml
  artifacts:
    paths:
      - chart.yaml

render-kustomize:
  stage: validate
  image:
    name: ${K8S_REGISTRY_PROXY}/kustomize/kustomize:v5.4.3
    entrypoint: [""]
  script:
    - kustomize build k8s > kustomize.yaml
  artifacts:
    paths:
      - kustomize.yaml

k8s-manifests:
  stage: validate
  needs: [render-chart, render-kustomize]
  image:
    name: ${GHCR_PROXY}/yannh/kubeconform:v0.6.7-alpine
    entrypoint: [""]
  script:
    - >-
      kubeconform -strict -summary
      -schema-location default
      -schema-location
      'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      chart.yaml kustomize.yaml
